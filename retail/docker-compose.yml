services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: retail_analytics
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://retail:retail123@postgres:5432/retail_analytics
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: retail-analytics-secret-key-change-in-production
      AI_SERVICE_API_KEY: ai-service-internal-key
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://backend:8000
      AI_SERVICE_API_KEY: ai-service-internal-key
      CAMERA_POLL_INTERVAL: "10"
      YOLO_MODEL: yolov8n.pt
      FRAME_SKIP: "2"
      RTSP_TRANSPORT: tcp
    volumes:
      - ai_models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ai_models:
