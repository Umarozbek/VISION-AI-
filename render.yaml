databases:
  - name: seevaai-db
    plan: free
    databaseName: retail_analytics
    user: retail

services:
  # Backend API
  - type: web
    name: seevaai-backend
    runtime: python
    plan: free
    rootDir: retail/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seevaai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: seevaai-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0

  # Frontend (Static Site)
  - type: web
    name: seevaai-frontend
    runtime: static
    plan: free
    rootDir: retail/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Redis
  - type: redis
    name: seevaai-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
